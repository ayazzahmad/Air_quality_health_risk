services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api           # only the final API stage is deployed
    image: air-quality-risk-api:latest
    container_name: air_quality_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Read from .env when present (see .env.example)
      - MODEL_PATH=${MODEL_PATH:-artifacts/model.joblib}
    # Optional: mount a local artifacts folder so you can update the model
    # without rebuilding the image.
    # volumes:
    #   - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      # python:slim has no curl, so use the standard library
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
